{% extends 'base.html' %}
{% load static %}
{% block content %}


        <div class="content">

            <div class="content-header">

                <div>

                    <span class="eyebrow">
                        MODIFICATION
                    </span>

                    <h1>Modifier le contact</h1>

                    <p>
                        Modifiez les informations de {{ contact.nom }} {{ contact.prenom }}.
                    </p>

                </div>

            </div>


            <div class="form-card">

                <div class="form-card-header">

                    <div class="form-icon">
                        <i class="fa-solid fa-user-pen"></i>
                    </div>

                    <div>

                        <h2> {{ contact.nom }} {{ contact.prenom }}</h2>

                        <p>
                            Modifiez les informations nécessaires.
                        </p>

                    </div>

                </div>


                <form method="post" action="{% url 'conf_modif' contact.id %}">
                    {% csrf_token %}

                    <div class="form-grid">

                        <div class="form-group">

                            <label>Prénom</label>

                            <input
                            name="prenom"
                                type="text"
                                value="{{ contact.prenom }}"
                            >

                        </div>


                        <div class="form-group">

                            <label>Nom</label>

                            <input
                                type="text"
                                value="{{ contact.nom }}"
                                name="nom"
                            >

                        </div>


                        <div class="form-group">

                            <label>Téléphone</label>

                            <input
                                type="tel"
                                value="{{ contact.telephone }}"
                                name="telephone"
                            >

                        </div>


                        <div class="form-group">

                            <label>Email</label>

                            <input
                                type="email"
                                value="{{ contact.email }}"
                                name="email"
                            >

                        </div>



                         <div class="form-group">

                            <label>Catégorie</label>

                            <select name="categorie_id">
                            
                                {% for categorie in categories %}

                                <option value="{{ categorie.id }}">
                                    {{ categorie.nom_categorie }}
                                </option>
                                
                                <option value="">
                                    
                                 
                                </option>

                                {% endfor %}

                                

                            </select>

                        </div>



                        <div class="form-group">

                            <label>Nouvelle Categorie</label>

                            <input
                                type="text"
                                placeholder="Bureau"
                                  name="nouvelle_categorie"
                            >

                        </div>


                        

                        <div class="form-group full">

                            <label>Adresse</label>

                            <input
                                type="text"
                                value="{{ contact.adresse }}"
                                name="adresse"

                            >

                        </div>


                        


                        
                        <div class="form-group full">

                            <label>Notes</label>

                            <textarea
                            name="note"
                               
                            > {{ contact.note }} </textarea>

                        </div



                       

                        



                    <div class="form-actions">

                        <a
                            href="{% url 'index' %}"
                            class="secondary-button"
                        >
                            Annuler
                        </a>
                        
                        <button
                            type="submit"
                            class="primary-button"
                        >
                            <i class="fa-solid fa-check"></i>
                            Enregistrer les modifications
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

</body>
</html>
{% endblock %}
