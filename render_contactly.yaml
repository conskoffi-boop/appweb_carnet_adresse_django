services:
  # Base de données PostgreSQL
  - type: pserv
    name: contactly-db
    ipAddress: null
    databaseName: contactly_db
    databaseUser: contactly_user
    region: frankfurt
    plan: free
    postgresSqlVersion: 16

  # Application Django Web
  - type: web
    name: contactly-app
    runtime: python
    runtimeVersion: 3.11
    plan: free
    region: frankfurt
    
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    
    startCommand: gunicorn carnet.wsgi:application
    
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contactly-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.8"
    
    autoDeploy: true
